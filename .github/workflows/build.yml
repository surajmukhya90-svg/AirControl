name: Build AirControl APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o AirControl*.zip
          if [ -d "AirControl" ]; then
            rm -rf AirControl/.github
            cp -rf AirControl/* .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configure Android
        run: |
          sed -i 's/@xml\/accessibility_service_config\.xml/@xml\/accessibility_service_config/g' app/src/main/AndroidManifest.xml
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties

      - name: Apply Gestures, Auto-Home and Low Sensitivity
        run: |
          # 1. Sensitivity ko slow aur smooth karein
          sed -i 's/\* 1.5f/\* 0.85f/g' app/src/main/java/com/aircontrol/app/service/CameraTrackingService.kt
          sed -i 's/\* 1.4f/\* 0.85f/g' app/src/main/java/com/aircontrol/app/service/CameraTrackingService.kt

          # 2. Click ko super easy karein (halka touch karte hi tap)
          sed -i 's/0.045f/0.095f/g' app/src/main/java/com/aircontrol/app/domain/GestureStateMachine.kt

          # 3. Auto-Home: Haath na dikhne par screen ke bottom center par dock karein
          sed -i 's/if (!landmarks.isNullOrEmpty() && landmarks\[0\].size > 8) {/if (landmarks.isNullOrEmpty()) { overlayManager?.updatePosition(screenWidth \/ 2f, screenHeight * 0.85f) } else if (landmarks[0].size > 8) {/g' app/src/main/java/com/aircontrol/app/service/CameraTrackingService.kt

      - name: Compile and Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-App
          path: "**/build/outputs/apk/debug/*.apk"
