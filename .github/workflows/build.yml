name: Build AirControl APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o AirControl*.zip
          if [ -d "AirControl" ]; then
            rm -rf AirControl/.github
            cp -rf AirControl/* .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configure Android Settings
        run: |
          sed -i 's/@xml\/accessibility_service_config\.xml/@xml\/accessibility_service_config/g' app/src/main/AndroidManifest.xml
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties

      - name: Update Accessibility Engine
        env:
          SERVICE_ACC: |
            package com.aircontrol.app.service

            import android.accessibilityservice.AccessibilityService
            import android.accessibilityservice.GestureDescription
            import android.graphics.Path
            import android.view.accessibility.AccessibilityEvent

            class AirAccessibilityService : AccessibilityService() {

                companion object {
                    var instance: AirAccessibilityService? = null
                        private set

                    val isRunning: Boolean
                        get() = instance != null
                }

                override fun onServiceConnected() {
                    super.onServiceConnected()
                    instance = this
                }

                override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
                override fun onInterrupt() { instance = null }
                override fun onDestroy() {
                    super.onDestroy()
                    instance = null
                }

                fun performTap(x: Float, y: Float) {
                    val clickPath = Path().apply { moveTo(x, y) }
                    val gesture = GestureDescription.Builder()
                        .addStroke(GestureDescription.StrokeDescription(clickPath, 0, 50))
                        .build()
                    dispatchGesture(gesture, null, null)
                }

                fun performReelNext(width: Float, height: Float) {
                    val path = Path().apply {
                        moveTo(width / 2f, height * 0.78f)
                        lineTo(width / 2f, height * 0.22f)
                    }
                    val gesture = GestureDescription.Builder()
                        .addStroke(GestureDescription.StrokeDescription(path, 0, 220))
                        .build()
                    dispatchGesture(gesture, null, null)
                }

                fun performReelPrev(width: Float, height: Float) {
                    val path = Path().apply {
                        moveTo(width / 2f, height * 0.22f)
                        lineTo(width / 2f, height * 0.78f)
                    }
                    val gesture = GestureDescription.Builder()
                        .addStroke(GestureDescription.StrokeDescription(path, 0, 220))
                        .build()
                    dispatchGesture(gesture, null, null)
                }
            }
        run: |
          printf "%s\n" "$SERVICE_ACC" > app/src/main/java/com/aircontrol/app/service/AirAccessibilityService.kt

      - name: Update Overlay Docking Engine
        env:
          SERVICE_OVERLAY: |
            package com.aircontrol.app.service

            import android.content.Context
            import android.graphics.Canvas
            import android.graphics.Color
            import android.graphics.Paint
            import android.graphics.PixelFormat
            import android.os.Build
            import android.os.Handler
            import android.os.Looper
            import android.view.Gravity
            import android.view.View
            import android.view.WindowManager
            import com.aircontrol.app.domain.VisualCursorState

            class CursorOverlayManager(private val context: Context) {
                private val windowManager = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                private val mainHandler = Handler(Looper.getMainLooper())
                private var cursorView: CursorView? = null
                private var isAttached = false

                private val layoutParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                    else
                        WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                            WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                            WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 500
                    y = 1200
                }

                fun show() {
                    mainHandler.post {
                        if (!isAttached) {
                            cursorView = CursorView(context)
                            windowManager.addView(cursorView, layoutParams)
                            isAttached = true
                        }
                    }
                }

                fun updatePosition(x: Float, y: Float) {
                    mainHandler.post {
                        if (!isAttached || cursorView == null) return@post
                        layoutParams.x = x.toInt()
                        layoutParams.y = y.toInt()
                        try {
                            windowManager.updateViewLayout(cursorView, layoutParams)
                        } catch (_: Exception) {}
                    }
                }

                fun returnToHome(homeX: Float, homeY: Float) {
                    mainHandler.post {
                        if (!isAttached || cursorView == null) return@post
                        val curX = layoutParams.x.toFloat()
                        val curY = layoutParams.y.toFloat()
                        layoutParams.x = (curX + (homeX - curX) * 0.25f).toInt()
                        layoutParams.y = (curY + (homeY - curY) * 0.25f).toInt()
                        cursorView?.setState(VisualCursorState.NORMAL)
                        try {
                            windowManager.updateViewLayout(cursorView, layoutParams)
                        } catch (_: Exception) {}
                    }
                }

                fun updateState(state: VisualCursorState) {
                    mainHandler.post {
                        cursorView?.setState(state)
                    }
                }

                fun hide() {
                    mainHandler.post {
                        if (isAttached && cursorView != null) {
                            try { windowManager.removeView(cursorView) } catch (_: Exception) {}
                            cursorView = null
                            isAttached = false
                        }
                    }
                }

                private class CursorView(context: Context) : View(context) {
                    private var currentState = VisualCursorState.NORMAL
                    private val outerPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.FILL
                        color = Color.parseColor("#4285F4")
                    }
                    private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                        style = Paint.Style.STROKE
                        strokeWidth = 6f
                        color = Color.WHITE
                    }

                    override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                        setMeasuredDimension(90, 90)
                    }

                    fun setState(state: VisualCursorState) {
                        this.currentState = state
                        when (state) {
                            VisualCursorState.NORMAL -> outerPaint.color = Color.parseColor("#4285F4")
                            VisualCursorState.PINCHED -> outerPaint.color = Color.parseColor("#EA4335")
                            VisualCursorState.SCROLLING -> outerPaint.color = Color.parseColor("#34A853")
                            else -> outerPaint.color = Color.parseColor("#FBBC04")
                        }
                        invalidate()
                    }

                    override fun onDraw(canvas: Canvas) {
                        super.onDraw(canvas)
                        val cx = width / 2f
                        val cy = height / 2f
                        val radius = if (currentState == VisualCursorState.PINCHED) 30f else 22f
                        canvas.drawCircle(cx, cy, radius, outerPaint)
                        canvas.drawCircle(cx, cy, radius, ringPaint)
                    }
                }
            }
        run: |
          printf "%s\n" "$SERVICE_OVERLAY" > app/src/main/java/com/aircontrol/app/service/CursorOverlayManager.kt

      - name: Update Tracking Service
        env:
          SERVICE_TRACKING: |
            package com.aircontrol.app.service

            import android.app.Notification
            import android.app.PendingIntent
            import android.app.Service
            import android.content.Intent
            import android.os.Handler
            import android.os.IBinder
            import android.os.Looper
            import android.os.SystemClock
            import android.util.Size
            import androidx.camera.core.CameraSelector
            import androidx.camera.core.ImageAnalysis
            import androidx.camera.lifecycle.ProcessCameraProvider
            import androidx.core.app.NotificationCompat
            import androidx.core.content.ContextCompat
            import androidx.lifecycle.Lifecycle
            import androidx.lifecycle.LifecycleOwner
            import androidx.lifecycle.LifecycleRegistry
            import com.aircontrol.app.AirControlApp
            import com.aircontrol.app.domain.OneEuroFilter
            import com.aircontrol.app.domain.VisualCursorState
            import com.aircontrol.app.tracking.HandTrackingAnalyzer
            import com.aircontrol.app.ui.MainActivity
            import java.util.concurrent.Executors
            import kotlin.math.hypot

            class CameraTrackingService : Service(), LifecycleOwner {

                private val lifecycleRegistry = LifecycleRegistry(this)
                private var overlayManager: CursorOverlayManager? = null
                private var analyzer: HandTrackingAnalyzer? = null
                private val cameraExecutor = Executors.newSingleThreadExecutor()
                private val mainHandler = Handler(Looper.getMainLooper())

                private val filterX = OneEuroFilter(minCutoff = 0.8, beta = 0.005)
                private val filterY = OneEuroFilter(minCutoff = 0.8, beta = 0.005)

                private var lastHandSeenTime = 0L
                private var isClickTriggered = false
                private var lastTapTime = 0L
                private var lastSwipeTime = 0L

                private var prevIndexY = -1f
                private var prevSwipeSampleTime = 0L

                override val lifecycle: Lifecycle get() = lifecycleRegistry

                companion object {
                    var isServiceRunning = false
                        private set
                }

                override fun onCreate() {
                    super.onCreate()
                    lifecycleRegistry.currentState = Lifecycle.State.CREATED
                    lifecycleRegistry.currentState = Lifecycle.State.STARTED
                    lifecycleRegistry.currentState = Lifecycle.State.RESUMED

                    overlayManager = CursorOverlayManager(this)
                    overlayManager?.show()
                    isServiceRunning = true

                    startAutoHomeLoop()
                }

                private fun startAutoHomeLoop() {
                    val metrics = resources.displayMetrics
                    val homeX = metrics.widthPixels / 2f
                    val homeY = metrics.heightPixels * 0.85f

                    mainHandler.post(object : Runnable {
                        override fun run() {
                            if (!isServiceRunning) return
                            val now = SystemClock.uptimeMillis()
                            if (now - lastHandSeenTime > 750L) {
                                overlayManager?.returnToHome(homeX, homeY)
                            }
                            mainHandler.postDelayed(this, 30L)
                        }
                    })
                }

                override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                    val notification = createNotification()
                    startForeground(101, notification)
                    startCameraAnalysis()
                    return START_STICKY
                }

                private fun startCameraAnalysis() {
                    val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                    cameraProviderFuture.addListener({
                        try {
                            val cameraProvider = cameraProviderFuture.get()
                            val metrics = resources.displayMetrics
                            val screenWidth = metrics.widthPixels.toFloat()
                            val screenHeight = metrics.heightPixels.toFloat()

                            analyzer = HandTrackingAnalyzer(
                                context = this,
                                onResult = { result, timestamp ->
                                    val landmarks = result.landmarks()
                                    if (!landmarks.isNullOrEmpty() && landmarks[0].size > 20) {
                                        lastHandSeenTime = timestamp
                                        val hand = landmarks[0]

                                        val wrist = hand[0]
                                        val thumbTip = hand[4]
                                        val indexTip = hand[8]
                                        val middleTip = hand[12]
                                        val ringTip = hand[16]
                                        val pinkyTip = hand[20]

                                        val rawScreenX = (indexTip.x() * screenWidth).coerceIn(0f, screenWidth)
                                        val rawScreenY = (indexTip.y() * screenHeight).coerceIn(0f, screenHeight)

                                        val smoothX = filterX.filter(rawScreenX.toDouble(), timestamp).toFloat()
                                        val smoothY = filterY.filter(rawScreenY.toDouble(), timestamp).toFloat()

                                        overlayManager?.updatePosition(smoothX, smoothY)

                                        val pinchDist = hypot((thumbTip.x() - indexTip.x()).toDouble(), (thumbTip.y() - indexTip.y()).toDouble()).toFloat()
                                        val indexToWrist = hypot((indexTip.x() - wrist.x()).toDouble(), (indexTip.y() - wrist.y()).toDouble()).toFloat()
                                        val middleToWrist = hypot((middleTip.x() - wrist.x()).toDouble(), (middleTip.y() - wrist.y()).toDouble()).toFloat()
                                        val ringToWrist = hypot((ringTip.x() - wrist.x()).toDouble(), (ringTip.y() - wrist.y()).toDouble()).toFloat()

                                        val isPinch = pinchDist < 0.085f
                                        val isFist = indexToWrist < 0.28f && middleToWrist < 0.28f && ringToWrist < 0.28f

                                        if (isPinch || isFist) {
                                            overlayManager?.updateState(VisualCursorState.PINCHED)
                                            if (!isClickTriggered && (timestamp - lastTapTime > 400L)) {
                                                isClickTriggered = true
                                                lastTapTime = timestamp
                                                AirAccessibilityService.instance?.performTap(smoothX, smoothY)
                                            }
                                        } else {
                                            isClickTriggered = false
                                            overlayManager?.updateState(VisualCursorState.NORMAL)
                                        }

                                        if (timestamp - prevSwipeSampleTime > 160L) {
                                            if (prevIndexY > 0f && (timestamp - lastSwipeTime > 700L)) {
                                                val deltaY = indexTip.y() - prevIndexY
                                                if (deltaY < -0.16f) {
                                                    lastSwipeTime = timestamp
                                                    overlayManager?.updateState(VisualCursorState.SCROLLING)
                                                    AirAccessibilityService.instance?.performReelNext(screenWidth, screenHeight)
                                                } else if (deltaY > 0.16f) {
                                                    lastSwipeTime = timestamp
                                                    overlayManager?.updateState(VisualCursorState.SCROLLING)
                                                    AirAccessibilityService.instance?.performReelPrev(screenWidth, screenHeight)
                                                }
                                            }
                                            prevIndexY = indexTip.y()
                                            prevSwipeSampleTime = timestamp
                                        }
                                    }
                                },
                                onError = { }
                            )

                            val analysisUseCase = ImageAnalysis.Builder()
                                .setTargetResolution(Size(480, 640))
                                .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                .build()
                                .also {
                                    it.setAnalyzer(cameraExecutor, analyzer!!)
                                }

                            val cameraSelector = CameraSelector.DEFAULT_FRONT_CAMERA
                            cameraProvider.unbindAll()
                            cameraProvider.bindToLifecycle(this, cameraSelector, analysisUseCase)
                        } catch (_: Exception) {}
                    }, ContextCompat.getMainExecutor(this))
                }

                private fun createNotification(): Notification {
                    val pendingIntent = PendingIntent.getActivity(
                        this, 0, Intent(this, MainActivity::class.java),
                        PendingIntent.FLAG_IMMUTABLE
                
