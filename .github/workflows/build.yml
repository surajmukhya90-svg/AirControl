name: Build AirControl APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip -o AirControl*.zip
          if [ -d "AirControl" ]; then
            rm -rf AirControl/.github
            cp -rf AirControl/* .
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Apply Smooth Hand Tracking & Main-Thread Fixes
        run: |
          # 1. Fix AndroidManifest xml reference
          sed -i 's/@xml\/accessibility_service_config\.xml/@xml\/accessibility_service_config/g' app/src/main/AndroidManifest.xml

          # 2. Fix Gradle Properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> gradle.properties

          # 3. Fix CursorOverlayManager (Main-Thread Safe Cursor)
          cat << 'EOF' > app/src/main/java/com/aircontrol/app/service/CursorOverlayManager.kt
          package com.aircontrol.app.service

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import com.aircontrol.app.domain.VisualCursorState

          class CursorOverlayManager(private val context: Context) {
              private val windowManager = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
              private val mainHandler = Handler(Looper.getMainLooper())
              private var cursorView: CursorView? = null
              private var isAttached = false

              private val layoutParams = WindowManager.LayoutParams(
                  WindowManager.LayoutParams.WRAP_CONTENT,
                  WindowManager.LayoutParams.WRAP_CONTENT,
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                  PixelFormat.TRANSLUCENT
              ).apply {
                  gravity = Gravity.TOP or Gravity.START
                  x = 500
                  y = 1000
              }

              fun show() {
                  mainHandler.post {
                      if (!isAttached) {
                          cursorView = CursorView(context)
                          windowManager.addView(cursorView, layoutParams)
                          isAttached = true
                      }
                  }
              }

              fun updatePosition(x: Float, y: Float) {
                  mainHandler.post {
                      if (!isAttached || cursorView == null) return@post
                      layoutParams.x = x.toInt()
                      layoutParams.y = y.toInt()
                      try {
                          windowManager.updateViewLayout(cursorView, layoutParams)
                      } catch (_: Exception) {}
                  }
              }

              fun updateState(state: VisualCursorState) {
                  mainHandler.post {
                      cursorView?.setState(state)
                  }
              }

              fun hide() {
                  mainHandler.post {
                      if (isAttached && cursorView != null) {
                          try {
                              windowManager.removeView(cursorView)
                          } catch (_: Exception) {}
                          cursorView = null
                          isAttached = false
                      }
                  }
              }

              private class CursorView(context: Context) : View(context) {
                  private var currentState = VisualCursorState.NORMAL
                  private val outerPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                      color = Color.parseColor("#4285F4")
                  }
                  private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 6f
                      color = Color.WHITE
                  }

                  override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                      setMeasuredDimension(90, 90)
                  }

                  fun setState(state: VisualCursorState) {
                      this.currentState = state
                      when (state) {
                          VisualCursorState.NORMAL -> outerPaint.color = Color.parseColor("#4285F4")
                          VisualCursorState.PINCHED -> outerPaint.color = Color.parseColor("#EA4335")
                          VisualCursorState.LONG_PRESS -> outerPaint.color = Color.parseColor("#FBBC04")
                          VisualCursorState.SCROLLING -> outerPaint.color = Color.parseColor("#34A853")
                          else -> outerPaint.color = Color.GRAY
                      }
                      invalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val cx = width / 2f
                      val cy = height / 2f
                      val radius = 24f
                      canvas.drawCircle(cx, cy, radius, outerPaint)
                      canvas.drawCircle(cx, cy, radius, ringPaint)
                  }
              }
          }
          EOF

          # 4. Fix HandTrackingAnalyzer (Memory Leak Safe & Low Latency)
          cat << 'EOF' > app/src/main/java/com/aircontrol/app/tracking/HandTrackingAnalyzer.kt
          package com.aircontrol.app.tracking

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.os.SystemClock
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarker
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarkerResult

          class HandTrackingAnalyzer(
              context: Context,
              private val onResult: (HandLandmarkerResult, Long) -> Unit,
              private val onError: (String) -> Unit
          ) : ImageAnalysis.Analyzer {

              private var handLandmarker: HandLandmarker? = null
              private var lastTimestampMs = 0L

              init {
                  try {
                      val baseOptions = BaseOptions.builder()
                          .setModelAssetPath("hand_landmarker.task")
                          .build()

                      val options = HandLandmarker.HandLandmarkerOptions.builder()
                          .setBaseOptions(baseOptions)
                          .setMinHandDetectionConfidence(0.5f)
                          .setMinTrackingConfidence(0.5f)
                          .setNumHands(1)
                          .setRunningMode(RunningMode.LIVE_STREAM)
                          .setResultListener { result, _ ->
                              onResult(result, SystemClock.uptimeMillis())
                          }
                          .setErrorListener { error ->
                              onError(error.message ?: "MediaPipe error")
                          }
                          .build()

                      handLandmarker = HandLandmarker.createFromOptions(context, options)
                  } catch (e: Exception) {
                      onError("Init error: ${e.localizedMessage}")
                  }
              }

              override fun analyze(imageProxy: ImageProxy) {
                  val now = SystemClock.uptimeMillis()
                  val frameTime = if (now <= lastTimestampMs) lastTimestampMs + 1 else now
                  lastTimestampMs = frameTime

                  try {
                      val bitmap = imageProxy.toBitmap()
                      val rotationDegrees = imageProxy.imageInfo.rotationDegrees

                      val matrix = Matrix().apply {
                          postRotate(rotationDegrees.toFloat())
                          postScale(-1f, 1f, (bitmap.width / 2f), (bitmap.height / 2f))
                      }

                      val rotatedBitmap = Bitmap.createBitmap(
                          bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true
                      )

                      val mpImage = BitmapImageBuilder(rotatedBitmap).build()
                      handLandmarker?.detectAsync(mpImage, frameTime)

                      if (rotatedBitmap != bitmap) {
                          rotatedBitmap.recycle()
                      }
                      bitmap.recycle()
                  } catch (_: Exception) {} finally {
                      imageProxy.close()
                  }
              }

              fun close() {
                  try {
                      handLandmarker?.close()
                  } catch (_: Exception) {}
                  handLandmarker = null
              }
          }
          EOF

          # 5. Fix CameraTrackingService (High FPS & Fast Analysis)
          cat << 'EOF' > app/src/main/java/com/aircontrol/app/service/CameraTrackingService.kt
          package com.aircontrol.app.service

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          import android.util.Size
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleOwner
          import androidx.lifecycle.LifecycleRegistry
          import com.aircontrol.app.AirControlApp
          import com.aircontrol.app.domain.GestureAction
          import com.aircontrol.app.domain.GestureStateMachine
          import com.aircontrol.app.domain.OneEuroFilter
          import com.aircontrol.app.tracking.HandTrackingAnalyzer
          import com.aircontrol.app.ui.MainActivity
          import java.util.concurrent.Executors

          class CameraTrackingService : Service(), LifecycleOwner {

              private val lifecycleRegistry = LifecycleRegistry(this)
              private var overlayManager: CursorOverlayManager? = null
              private var analyzer: HandTrackingAnalyzer? = null
              private val cameraExecutor = Executors.newSingleThreadExecutor()

              private val filterX = OneEuroFilter()
              private val filterY = OneEuroFilter()
              private val stateMachine = GestureStateMachine()

              override val lifecycle: Lifecycle get() = lifecycleRegistry

              companion object {
                  var isServiceRunning = false
                      private set
              }

              override fun onCreate() {
                  super.onCreate()
                  lifecycleRegistry.currentState = Lifecycle.State.CREATED
                  lifecycleRegistry.currentState = Lifecycle.State.STARTED
                  lifecycleRegistry.currentState = Lifecycle.State.RESUMED

                  overlayManager = CursorOverlayManager(this)
                  overlayManager?.show()
                  isServiceRunning = true
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val notification = createNotification()
                  startForeground(101, notification)
                  startCameraAnalysis()
                  return START_STICKY
              }

              private fun startCameraAnalysis() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      try {
                          val cameraProvider = cameraProviderFuture.get()
                          val metrics = resources.displayMetrics
                          val screenWidth = metrics.widthPixels.toFloat()
                          val screenHeight = metrics.heightPixels.toFloat()

                          analyzer = HandTrackingAnalyzer(
                              context = this,
                              onResult = { result, timestamp ->
                                  val landmarks = result.landmarks()
                                  if (!landmarks.isNullOrEmpty() && landmarks[0].size > 8) {
                                      val hand = landmarks[0]
                                      val indexX = hand[8].x()
                                      val indexY = hand[8].y()
                                      val thumbX = hand[4].x()
                                      val thumbY = hand[4].y()
                                      val middleY = hand[12].y()

                                      val rawScreenX = (indexX * screenWidth * 1.4f).coerceIn(0f, screenWidth)
                                      val rawScreenY = (indexY * screenHeight * 1.4f).coerceIn(0f, screenHeight)

                                      val smoothX = filterX.filter(rawScreenX.toDouble(), timestamp).toFloat()
                                      val smoothY = filterY.filter(rawScreenY.toDouble(), timestamp).toFloat()

                                      overlayManager?.updatePosition(smoothX, smoothY)

                                      stateMachine.processFrame(
                                          thumbTipX = thumbX,
                                          thumbTipY = thumbY,
                                          indexTipX = indexX,
                                          indexTipY = indexY,
                                          middleTipY = middleY,
                                          screenX = smoothX,
                                          screenY = smoothY,
                                          currentTimeMs = timestamp,
                                          onAction = { action ->
                                              handleGestureAction(action)
                                          },
                                          onStateChange = { cursorState ->
                                              overlayManager?.updateState(cursorState)
                                          }
                                      )
                                  }
                              },
                              onError = { }
                          )

                          val analysisUseCase = ImageAnalysis.Builder()
                              .setTargetResolution(Size(480, 640))
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()
                              .also {
                                  it.setAnalyzer(cameraExecutor, analyzer!!)
                              }

                          val cameraSelector = CameraSelector.DEFAULT_FRONT_CAMERA
                          cameraProvider.unbindAll()
                          cameraProvider.bindToLifecycle(this, cameraSelector, analysisUseCase)
                      } catch (_: Exception) {}
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun handleGestureAction(action: GestureAction) {
                  val accessibility = AirAccessibilityService.instance ?: return
                  when (action) {
                      is GestureAction.Click -> accessibility.performTap(action.x, action.y)
                      is GestureAction.LongPress -> accessibility.performLongPress(action.x, action.y)
                      is GestureAction.Scroll -> accessibility.performScroll(action.startX, action.startY, action.deltaY)
                      is GestureAction.Back -> accessibility.performBack()
                      is GestureAction.Home -> accessibility.performHome()
                      is GestureAction.Move, is GestureAction.Drag -> {}
                  }
              }

              private fun createNotification(): Notification {
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, AirControlApp.CHANNEL_ID)
                      .setContentTitle("AirControl is Active")
                      .setContentText("Hand tracking & air gestures are live")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isServiceRunning = false
                  lifecycleRegistry.currentState = Lifecycle.State.DESTROYED
                  analyzer?.close()
                  cameraExecutor.shutdown()
                  overlayManager?.hide()
                  stateMachine.reset()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Compile and Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirControl-App
          path: "**/build/outputs/apk/debug/*.apk"
